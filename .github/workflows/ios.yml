name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Test
        run: |
          xcodebuild \
            -project UI_Unit_test.xcodeproj \
            -scheme UI_Unit_test \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone Air' \
            clean test
